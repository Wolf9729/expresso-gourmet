name: Bootstrap source import

on:
  push:
    branches:
      - main
      - "bootstrap/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Expand the staged source archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bootstrap/READY ]]; then
            echo "Waiting for the complete source archive."
            exit 0
          fi
          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name 'source-*.b64' -print | sort)
          if [[ "${#parts[@]}" -ne 23 ]]; then
            echo "Expected 23 archive parts; found ${#parts[@]}."
            exit 1
          fi
          cat "${parts[@]}" | base64 --decode | tar -xz --no-same-owner -C .
          rm -f .bootstrap/source-*.b64 .bootstrap/READY
          rmdir .bootstrap || true
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "chore: import Expresso Gourmet application source"
          git push origin "HEAD:${{ github.ref_name }}"
