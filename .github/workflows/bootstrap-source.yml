name: Import source and validate build

on:
  push:
    branches: [main]
    paths: ['.bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import the staged source archive
        id: import
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bootstrap/READY ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Source archive not complete yet."
            exit 0
          fi
          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name 'source-*.b64' -print | sort)
          if [[ "${#parts[@]}" -ne 10 ]]; then
            echo "Expected 10 archive parts; found ${#parts[@]}" >&2
            exit 1
          fi
          cat "${parts[@]}" | base64 --decode | tar -xJ --no-same-owner -C .
          rm -f .bootstrap/source-*.b64 .bootstrap/READY
          rmdir .bootstrap || true
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: import Expresso Gourmet application source"
            git push origin HEAD:main
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        if: steps.import.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        if: steps.import.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - name: Scan for committed secrets
        if: steps.import.outputs.ready == 'true'
        run: npm run check:secrets
      - name: Validate static structure
        if: steps.import.outputs.ready == 'true'
        run: npm run check:static
      - name: Lint
        if: steps.import.outputs.ready == 'true'
        run: npm run lint
      - name: Build Next.js
        if: steps.import.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-server-key
          PICKUP_TOKEN_SECRET: ci-placeholder-secret-at-least-32-characters
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npm run build
